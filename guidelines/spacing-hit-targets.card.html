<!-- @dsCard group="Spacing" viewport="700x80" name="Hit Targets" subtitle="44pt on touch, 28pt on dense desktop" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .sw{width:84px}
  .sw i{display:block;height:46px;border-radius:10px;box-shadow:var(--specular-rim)}
  .sw b{display:block;font-size:11px;font-weight:600;margin-top:6px;color:var(--text-primary)}
  .sw s{display:block;font-size:10px;text-decoration:none;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .row{display:flex;align-items:baseline;gap:14px;padding:3px 0}
  .row .m{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);min-width:112px;flex:0 0 auto}
</style>
</head>
<body>
<div class="g" style="align-items:center;gap:18px">
  <div style="display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:color-mix(in srgb,var(--tint) 18%,transparent);font-size:10px;font-family:var(--font-mono)">44</div>
  <div style="display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:color-mix(in srgb,var(--tint) 18%,transparent);font-size:10px;font-family:var(--font-mono)">36</div>
  <div style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:color-mix(in srgb,var(--tint) 18%,transparent);font-size:9px;font-family:var(--font-mono)">28</div>
  <span style="font-size:13px;color:var(--text-secondary);max-width:380px">A control may <i>look</i> smaller than its target — pad the hit area, don't grow the glyph.</span>
</div>
</body>
</html>
