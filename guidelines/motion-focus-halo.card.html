<!-- @dsCard group="Motion" viewport="700x103" name="Focus Halo" subtitle="A 4px tint halo at 18% alpha — never a hard outline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .lab{font-size:11px;font-weight:600;margin-top:7px;color:var(--text-primary)}
  .stage{border-radius:18px;overflow:hidden;position:relative}
  .pane{position:relative;isolation:isolate;box-shadow:var(--specular);border-radius:18px;
        display:grid;place-items:center;height:92px;font-size:13px;font-weight:600;color:var(--text-primary)}
  .pane::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lens-gradient);z-index:-1}
</style>
</head>
<body>
<div class="g" style="gap:18px;align-items:flex-start">
  <div style="width:220px"><div style="height:44px;border-radius:10px;background:var(--bg-grouped);box-shadow:0 0 0 4px color-mix(in srgb,var(--tint) 18%,transparent);display:flex;align-items:center;padding:0 14px;font-size:17px;color:var(--text-tertiary)">Focused field</div><div class="lab">--focus-halo</div></div>
  <div style="width:220px"><div style="height:44px;border-radius:10px;background:var(--bg-grouped);box-shadow:0 0 0 4px color-mix(in srgb,var(--status-danger) 18%,transparent);display:flex;align-items:center;padding:0 14px;font-size:17px;color:var(--status-danger)">Invalid</div><div class="lab">danger halo</div></div>
  <div style="width:180px"><div style="height:44px;border-radius:10px;background:var(--bg-grouped);outline:2px solid #000;display:flex;align-items:center;padding:0 14px;font-size:17px;color:var(--text-tertiary)">Wrong</div><div class="lab">hard outline — not this language</div></div>
</div>
</body>
</html>
