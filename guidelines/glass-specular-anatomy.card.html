<!-- @dsCard group="Glass" viewport="700x208" name="Specular Anatomy" subtitle="The four layers, added one at a time — the top highlight is what makes it glass" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .lab{font-size:11px;font-weight:600;margin-top:7px;color:var(--text-primary)}
  .stage{border-radius:18px;overflow:hidden;position:relative}
  .pane{position:relative;isolation:isolate;box-shadow:var(--specular);border-radius:18px;
        display:grid;place-items:center;height:92px;font-size:13px;font-weight:600;color:var(--text-primary)}
  .pane::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lens-gradient);z-index:-1}
</style>
</head>
<body>
<div class="lg-wallpaper stage" style="padding:16px">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
    <div><div class="pane" style="background:rgba(255,255,255,.78);box-shadow:none">1 · fill only</div><div class="lab" style="color:#fff">flat film</div></div>
    <div><div class="pane" style="background:rgba(255,255,255,.78);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:none">2 · + blur</div><div class="lab" style="color:#fff">frosted</div></div>
    <div><div class="pane" style="background:rgba(255,255,255,.78);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85)">3 · + top edge</div><div class="lab" style="color:#fff">reads as glass</div></div>
    <div><div class="pane" style="background:rgba(255,255,255,.78);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--specular)">4 · + rim & shade</div><div class="lab" style="color:#fff">has thickness</div></div>
  </div>
  <div class="tk" style="margin-top:10px;color:rgba(255,255,255,.75)">--specular-top: inset 0 1.5px 0 · --specular-rim: inset 0 0 0 .5px · --specular-bottom: inset 0 -1px 2px</div>
</div>
</body>
</html>
