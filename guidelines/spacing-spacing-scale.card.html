<!-- @dsCard group="Spacing" viewport="700x137" name="Spacing Scale" subtitle="8pt base with 4 as the half step" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .sw{width:84px}
  .sw i{display:block;height:46px;border-radius:10px;box-shadow:var(--specular-rim)}
  .sw b{display:block;font-size:11px;font-weight:600;margin-top:6px;color:var(--text-primary)}
  .sw s{display:block;font-size:10px;text-decoration:none;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .row{display:flex;align-items:baseline;gap:14px;padding:3px 0}
  .row .m{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);min-width:112px;flex:0 0 auto}
</style>
</head>
<body>
<div class="g" style="align-items:flex-end">
<div style="text-align:center"><div style="width:4px;height:4px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">32</div></div><div style="text-align:center"><div style="width:44px;height:44px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">44</div></div><div style="text-align:center"><div style="width:56px;height:56px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">56</div></div><div style="text-align:center"><div style="width:80px;height:80px;background:color-mix(in srgb,var(--tint) 28%,transparent);border-radius:4px"></div><div class="tk" style="margin-top:6px">80</div></div></div>
</body>
</html>
