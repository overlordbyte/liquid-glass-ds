<!-- @dsCard group="Motion" viewport="700x128" name="Press & Hover" subtitle="Controls shrink; they never just darken" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .lab{font-size:11px;font-weight:600;margin-top:7px;color:var(--text-primary)}
  .stage{border-radius:18px;overflow:hidden;position:relative}
  .pane{position:relative;isolation:isolate;box-shadow:var(--specular);border-radius:18px;
        display:grid;place-items:center;height:92px;font-size:13px;font-weight:600;color:var(--text-primary)}
  .pane::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lens-gradient);z-index:-1}
</style>
</head>
<body>
<style>
  .d{display:grid;place-items:center;height:44px;border-radius:12px;background:var(--tint);color:#fff;font-size:15px;font-weight:600;transition:transform 160ms var(--ease-standard),opacity 160ms}
  .d.p{transform:scale(.96)}
  .d.h{opacity:.86;transform:translateY(-1px)}
  .cell{width:150px}
</style>
<div class="g" style="gap:16px">
  <div class="cell"><div class="d">Rest</div><div class="lab">scale 1.0</div></div>
  <div class="cell"><div class="d h">Hover</div><div class="lab">−1px, 86% opacity</div></div>
  <div class="cell"><div class="d p">Pressed</div><div class="lab">scale 0.96 — --press-scale</div></div>
  <div class="cell"><div class="d" style="opacity:.32">Disabled</div><div class="lab">32% — no pointer events</div></div>
</div>
<div class="tk" style="margin-top:10px">Cards and sheets press to 0.985 (--press-scale-large). Reduced-motion collapses all of it to 1ms.</div>
</body>
</html>
