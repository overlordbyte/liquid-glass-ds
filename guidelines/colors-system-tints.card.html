<!-- @dsCard group="Colors" viewport="700x119" name="System Tints" subtitle="Accent only — one tint per surface, reserved for the primary action" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .sw{width:84px}
  .sw i{display:block;height:46px;border-radius:10px;box-shadow:var(--specular-rim)}
  .sw b{display:block;font-size:11px;font-weight:600;margin-top:6px;color:var(--text-primary)}
  .sw s{display:block;font-size:10px;text-decoration:none;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .row{display:flex;align-items:baseline;gap:14px;padding:3px 0}
  .row .m{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);min-width:112px;flex:0 0 auto}
</style>
</head>
<body>
<div class="g">
  <div class="sw"><i style="background:#007aff"></i><b>Blue</b><s>--tint-blue</s></div>
  <div class="sw"><i style="background:#34c759"></i><b>Green</b><s>--tint-green</s></div>
  <div class="sw"><i style="background:#ff3b30"></i><b>Red</b><s>--tint-red</s></div>
  <div class="sw"><i style="background:#ff9500"></i><b>Orange</b><s>--tint-orange</s></div>
  <div class="sw"><i style="background:#af52de"></i><b>Purple</b><s>--tint-purple</s></div>
  <div class="sw"><i style="background:#ff2d55"></i><b>Pink</b><s>--tint-pink</s></div>
  <div class="sw"><i style="background:#ffcc00"></i><b>Yellow</b><s>--tint-yellow</s></div>
</div>
</body>
</html>
