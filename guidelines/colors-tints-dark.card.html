<!-- @dsCard group="Colors" viewport="700x139" name="Tints Dark" subtitle="Brightened one step so the accent survives on black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .sw{width:78px}
  .sw i{display:block;height:46px;border-radius:10px;box-shadow:var(--specular-rim)}
  .sw b{display:block;font-size:11px;font-weight:600;margin-top:6px;color:var(--text-primary)}
  .sw s{display:block;font-size:10px;text-decoration:none;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .row{display:flex;align-items:baseline;gap:14px;padding:3px 0}
  .row .m{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);min-width:112px;flex:0 0 auto}
</style>
</head>
<body>
<div class="g" style="background:#000;padding:10px;border-radius:14px">
  <div class="sw"><i style="background:#0a84ff"></i><b>Blue</b><s>--tint-blue</s></div>
  <div class="sw"><i style="background:#30d158"></i><b>Green</b><s>--tint-green</s></div>
  <div class="sw"><i style="background:#ff453a"></i><b>Red</b><s>--tint-red</s></div>
  <div class="sw"><i style="background:#ff9f0a"></i><b>Orange</b><s>--tint-orange</s></div>
  <div class="sw"><i style="background:#bf5af2"></i><b>Purple</b><s>--tint-purple</s></div>
  <div class="sw"><i style="background:#ff375f"></i><b>Pink</b><s>--tint-pink</s></div>
  <div class="sw"><i style="background:#ffd60a"></i><b>Yellow</b><s>--tint-yellow</s></div>
</div>
<style>.g[style] .sw b{color:#f5f5f7}</style>
</body>
</html>
