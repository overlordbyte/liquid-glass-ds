<!-- @dsCard group="Brand" viewport="700x199" name="Iconography" subtitle="Lucide on a 24px grid at 1.75 stroke — the open stand-in for SF Symbols" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .lab{font-size:11px;font-weight:600;margin-top:7px;color:var(--text-primary)}
  .stage{border-radius:18px;overflow:hidden;position:relative}
  .pane{position:relative;isolation:isolate;box-shadow:var(--specular);border-radius:18px;
        display:grid;place-items:center;height:92px;font-size:13px;font-weight:600;color:var(--text-primary)}
  .pane::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--lens-gradient);z-index:-1}
</style>
</head>
<body>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<div class="g" style="gap:18px;align-items:flex-start">
<div style="text-align:center;width:68px"><i data-lucide="house"></i><div class="tk" style="margin-top:6px">house</div></div><div style="text-align:center;width:68px"><i data-lucide="search"></i><div class="tk" style="margin-top:6px">search</div></div><div style="text-align:center;width:68px"><i data-lucide="user"></i><div class="tk" style="margin-top:6px">user</div></div><div style="text-align:center;width:68px"><i data-lucide="settings"></i><div class="tk" style="margin-top:6px">settings</div></div><div style="text-align:center;width:68px"><i data-lucide="share"></i><div class="tk" style="margin-top:6px">share</div></div><div style="text-align:center;width:68px"><i data-lucide="heart"></i><div class="tk" style="margin-top:6px">heart</div></div><div style="text-align:center;width:68px"><i data-lucide="plus"></i><div class="tk" style="margin-top:6px">plus</div></div><div style="text-align:center;width:68px"><i data-lucide="chevron-right"></i><div class="tk" style="margin-top:6px">chevron-right</div></div><div style="text-align:center;width:68px"><i data-lucide="bell"></i><div class="tk" style="margin-top:6px">bell</div></div><div style="text-align:center;width:68px"><i data-lucide="folder"></i><div class="tk" style="margin-top:6px">folder</div></div><div style="text-align:center;width:68px"><i data-lucide="play"></i><div class="tk" style="margin-top:6px">play</div></div><div style="text-align:center;width:68px"><i data-lucide="ellipsis"></i><div class="tk" style="margin-top:6px">ellipsis</div></div>
</div>
<div class="tk" style="margin-top:12px">SF Symbols cannot be redistributed — Lucide matches the grid and optical weight. Swap components/core/Icon.jsx if you hold a licence.</div>
<script>lucide.createIcons({ attrs: { width: 24, height: 24, "stroke-width": 1.75 } });</script>
</body>
</html>
