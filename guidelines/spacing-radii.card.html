<!-- @dsCard group="Spacing" viewport="700x224" name="Radii" subtitle="Radius grows with the surface, never with nesting depth" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:transparent}
  body{padding:14px 18px;font-family:var(--font-text)}
  .g{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .sw{width:84px}
  .sw i{display:block;height:46px;border-radius:10px;box-shadow:var(--specular-rim)}
  .sw b{display:block;font-size:11px;font-weight:600;margin-top:6px;color:var(--text-primary)}
  .sw s{display:block;font-size:10px;text-decoration:none;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}
  .row{display:flex;align-items:baseline;gap:14px;padding:3px 0}
  .row .m{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);min-width:112px;flex:0 0 auto}
</style>
</head>
<body>
<div class="g">
<div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:6px;height:52px"></i><b>xs</b><s>6px</s></div><div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:10px;height:52px"></i><b>sm</b><s>10px</s></div><div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:12px;height:52px"></i><b>md</b><s>12px</s></div><div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:14px;height:52px"></i><b>lg</b><s>14px</s></div><div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:16px;height:52px"></i><b>xl</b><s>16px</s></div><div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:22px;height:52px"></i><b>2xl</b><s>22px</s></div><div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:28px;height:52px"></i><b>3xl</b><s>28px</s></div><div class="sw" style="width:84px"><i style="background:var(--fill-2);border-radius:999px;height:52px"></i><b>full</b><s>999px</s></div></div>
</body>
</html>
