<html lang="en">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<div id="root"></div>
<script type="text/babel" data-presets="react">
const { SiteHeader, Hero, FeatureSection, PricingSection, SiteFooter } = window.LiquidGlassKits["web-marketing"];

function Page() {
  const [active, setActive] = React.useState("Product");
  return (
    <>
      <SiteHeader active={active} onNavigate={setActive} />
      <Hero />
      <FeatureSection />
      <PricingSection />
      <SiteFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
