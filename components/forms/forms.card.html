<!-- @dsCard group="Components" viewport="700x330" name="Forms" subtitle="Fields, toggles, segmented control, slider" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="../../preview/bundle.js"></script>
<style>
  html, body { margin: 0; background: transparent; }
  #root { padding: 16px 20px; }
  .stage { border-radius: var(--radius-panel); }
  .cap { font-size: var(--size-11); font-weight: 500; letter-spacing: .06em;
          text-transform: uppercase; color: var(--text-tertiary); }
  
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Input, Textarea, Select, Switch, Checkbox, Radio, SegmentedControl, Slider, SearchField, Icon } = window.LiquidGlass;

function Demo() {
  const [on, setOn] = React.useState(true);
  const [off, setOff] = React.useState(false);
  const [checked, setChecked] = React.useState(true);
  const [plan, setPlan] = React.useState("monthly");
  const [range, setRange] = React.useState("Week");
  const [vol, setVol] = React.useState(64);
  const [q, setQ] = React.useState("tash");
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px 24px" }}>
      <div style={{ display: "grid", gap: 12 }}>
        <Input label="Email" placeholder="you@example.com" hint="Never shared." />
        <Input label="Password" type="password" defaultValue="hunter2" error="Too short" />
        <Input size="sm" leading={<Icon name="search" size={15} />} placeholder="Filter (dense 28px)" />
        <SearchField value={q} onChange={setQ} onClear={() => setQ("")} />
      </div>
      <div style={{ display: "grid", gap: 12 }}>
        <Select label="Region" options={["Tashkent", "Andijan", "Samarkand"]} />
        <SegmentedControl options={["Day", "Week", "Month"]} value={range} onChange={setRange} />
        <Slider value={vol} onChange={setVol}
          leading={<Icon name="volume-1" size={16} />} trailing={<Icon name="volume-2" size={16} />} />
        <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
          <Switch checked={on} onChange={setOn} label="Wi-Fi" />
          <Switch checked={off} onChange={setOff} label="Bluetooth" />
          <Checkbox checked={checked} onChange={setChecked} label="Agree" />
          <Radio name="p" value="monthly" checked={plan === "monthly"} onChange={setPlan} label="Monthly" />
          <Radio name="p" value="yearly" checked={plan === "yearly"} onChange={setPlan} label="Yearly" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
